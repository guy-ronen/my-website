<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון מודרני | גיא רונן</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <main class="page-shell">
        <a class="back-link" href="index.html">חזרה לתיק העבודות →</a>

        <section class="project-intro">
            <p class="eyebrow">פרויקט אינטראקטיבי / 01</p>
            <h1>מחשבון מודרני</h1>
            <p class="intro-copy">כלי דפדפן קטן וממוקד, שתורגם מיישום Python Tkinter לחוויית שימוש אינטרנטית ורספונסיבית.</p>
        </section>

        <section class="calculator-layout" aria-label="פרויקט מחשבון">
            <div class="calculator" aria-label="מחשבון">
                <div class="display-area" aria-live="polite">
                    <span id="operation-display" class="operation-display"></span>
                    <output id="display" class="display">0</output>
                </div>
                <div class="button-area" aria-label="כפתורי המחשבון">
                    <button class="button button-clear" data-action="clear">ניקוי</button>
                    <button class="button button-operator" data-operator="/">/</button>
                    <button class="button button-operator" data-operator="*">*</button>
                    <button class="button button-operator" data-operator="-">-</button>
                    <button class="button" data-number="7">7</button>
                    <button class="button" data-number="8">8</button>
                    <button class="button" data-number="9">9</button>
                    <button class="button button-operator" data-operator="+">+</button>
                    <button class="button" data-number="4">4</button>
                    <button class="button" data-number="5">5</button>
                    <button class="button" data-number="6">6</button>
                    <button class="button button-equals" data-action="calculate">=</button>
                    <button class="button" data-number="1">1</button>
                    <button class="button" data-number="2">2</button>
                    <button class="button" data-number="3">3</button>
                    <button class="button" data-number="0">0</button>
                    <button class="button" data-action="decimal">.</button>
                </div>
            </div>

            <aside class="project-notes">
                <span class="note-label">מה הפרויקט מדגים</span>
                <ul>
                    <li>ניהול מצב באמצעות JavaScript</li>
                    <li>עיצוב ממשק רספונסיבי</li>
                    <li>שליטה באמצעות מקלדת וכפתורים</li>
                    <li>טיפול בחלוקה באפס</li>
                </ul>
            </aside>
        </section>
    </main>
    <script src="calculator.js"></script>
</body>
</html>
